name: Aux Bots (Kho 9 + Ung Ho SV + Redirects) 24/7 Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: multi-bot-24-7-single-instance
  cancel-in-progress: false

jobs:
  run-aux-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone & Start Kho 9 + Ung Ho Sinh Vien + Redirect Bots 24/7 (Without Bot 8)
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PYTHONUTF8: "1"
          QUIET_STARTUP: "1"
        run: |
          git config --global user.name "ShopBot AutoSave"
          git config --global user.email "bot@users.noreply.github.com"

          git clone https://x-access-token:${PAT_TOKEN}@github.com/alexandratodika/kho9-tele-shop-bot.git bot9
          git clone https://x-access-token:${PAT_TOKEN}@github.com/alexandratodika/unghosinhvien-tele-bot.git bot10

          pip install --upgrade pip
          pip install -r bot9/requirements.txt -r bot10/requirements.txt

          save_all_bot_states() {
            for d in bot9 bot10; do
              (
                cd "$d"
                git checkout -- hub_tunnel.json 2>/dev/null || true
                python -c "import os, sqlite3; [(c := sqlite3.connect(f, timeout=15), c.execute('PRAGMA wal_checkpoint(TRUNCATE)'), c.close()) for f in ('shop_data.db', 'ungho_data.db') if os.path.exists(f)]" 2>/dev/null || true
                shopt -s nullglob
                for f in shop_data.db ungho_data.db skyworld_cache.json domdalton_cache.json; do
                  if [ -f "$f" ]; then
                    git add -f "$f" 2>/dev/null || true
                  fi
                done
                if ! git diff --cached --quiet; then
                  git commit -m "chore: auto-save db & cache [skip ci]" || true
                  if ! git pull --rebase -X ours origin main; then
                    git rebase --abort 2>/dev/null || true
                    git fetch origin main || true
                    git reset origin/main || true
                    for f in shop_data.db ungho_data.db skyworld_cache.json domdalton_cache.json; do
                      if [ -f "$f" ]; then git add -f "$f" 2>/dev/null || true; fi
                    done
                    git commit -m "chore: auto-save db & cache [skip ci]" || true
                  fi
                  git push origin main || true
                fi
              )
            done
          }

          # Auto-save database & synced catalog cache loop every 180 seconds for bot9 & bot10
          (
            while true; do
              sleep 180
              save_all_bot_states
            done
          ) &
          AUTOSAVE_PID=$!

          # Hot-sync hub_tunnel.json for bot9 & bot10 (and .env for bot10 if needed)
          (
            while true; do
              for d in bot9 bot10; do
                (
                  cd "$d"
                  git fetch origin main 2>/dev/null || true
                  git checkout origin/main -- hub_tunnel.json 2>/dev/null || true
                )
              done
              if ! grep -qE '^BOT_TOKEN=.+$' bot10/.env 2>/dev/null; then
                (cd bot10 && git checkout origin/main -- .env 2>/dev/null || true)
              fi
              sleep 45
            done
          ) &
          HOTSYNC_PID=$!

          # Launch Lightweight Redirect Bots (Kho 1 & 2 -> @airenhatbot, Kho 5 & 6 -> @aicoderenhatbot)
          (
            cd bot9
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT ${REMAINING}s python -X utf8 redirect_bots.py || true
              sleep 3
            done
          ) &

          sleep 2

          # Launch Bot 9 (@aicoderenhatbot) and Bot 10 (Ung ho sinh vien) in parallel
          for d in bot9 bot10; do
            (
              cd "$d"
              START_TIME=$SECONDS
              while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
                REMAINING=$((19500 - (SECONDS - START_TIME)))
                if [ $REMAINING -le 0 ]; then break; fi
                timeout --signal=SIGINT ${REMAINING}s python -X utf8 bot.py || true
                sleep 3
              done
            ) &
          done

          sleep 19508

          kill "$AUTOSAVE_PID" "$HOTSYNC_PID" 2>/dev/null || true
          wait "$AUTOSAVE_PID" 2>/dev/null || true

          save_all_bot_states

          curl -s -X POST \
            -H "Authorization: token ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/alexandratodika/tele-shop-cloud-runner/actions/workflows/run-24-7.yml/dispatches \
            -d '{"ref":"main"}' || true

      - name: Final Zero-Loss DB & Session Save (On Exit or Cancel)
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          pkill -INT -f "python -X utf8" 2>/dev/null || true
          sleep 2
          for d in bot9 bot10; do
            if [ -d "$d/.git" ]; then
              (
                cd "$d"
                git checkout -- hub_tunnel.json 2>/dev/null || true
                python -c "import os, sqlite3; [(c := sqlite3.connect(f, timeout=15), c.execute('PRAGMA wal_checkpoint(TRUNCATE)'), c.close()) for f in ('shop_data.db', 'ungho_data.db') if os.path.exists(f)]" 2>/dev/null || true
                shopt -s nullglob
                for f in shop_data.db ungho_data.db skyworld_cache.json domdalton_cache.json; do
                  if [ -f "$f" ]; then
                    git add -f "$f" 2>/dev/null || true
                  fi
                done
                if ! git diff --cached --quiet; then
                  git commit -m "chore: final zero-loss save db & cache [skip ci]" || true
                  if ! git pull --rebase -X ours origin main; then
                    git rebase --abort 2>/dev/null || true
                    git fetch origin main || true
                    git reset origin/main || true
                    for f in shop_data.db ungho_data.db skyworld_cache.json domdalton_cache.json; do
                      if [ -f "$f" ]; then git add -f "$f" 2>/dev/null || true; fi
                    done
                    git commit -m "chore: final zero-loss save db & cache [skip ci]" || true
                  fi
                  git push origin main || true
                fi
              )
            fi
          done
